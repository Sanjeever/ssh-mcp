name: 检查与打包

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: 集中编译与单包准备
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm fetch --frozen-lockfile
      - run: pnpm install --frozen-lockfile --offline --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm build
      - run: node --import=tsx scripts/release.ts prepare
      - run: node --import=tsx scripts/release.ts verify
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  native:
    name: 原生验证 ${{ matrix.target }} Node ${{ matrix.node }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            node: '26'
          - os: ubuntu-24.04-arm
            target: linux-arm64
            node: '26'
          - os: macos-15
            target: darwin-arm64
            node: '26'
          - os: macos-15-intel
            target: darwin-x64
            node: '26'
          - os: windows-2025
            target: win32-x64
            node: '26'
          - os: windows-11-arm
            target: win32-arm64
            node: '26'
          - os: ubuntu-24.04
            target: linux-x64
            node: '22.0.0'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm fetch --frozen-lockfile
      - run: pnpm install --frozen-lockfile --offline --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: 核对同一份待发布 tarball
        run: node --import=tsx scripts/release.ts verify
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: 测试 TypeScript 模块与真实 stdio
        run: node --import=tsx --test test/*.test.ts scripts/*.test.ts
      - name: 正常安装、禁用脚本及省略可选依赖
        shell: bash
        run: node --import=tsx scripts/pack-check.ts dist/packages/*.tgz
